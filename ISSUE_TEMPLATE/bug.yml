name: 버그
description: 잘못 동작하는 것을 신고
title: "[fix] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 현상
      description: 무엇이 잘못됐는지
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 환경
      multiple: true
      options:
        - Unity 에디터
        - Android
        - iOS
        - 서버
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그·스크린샷
      render: text